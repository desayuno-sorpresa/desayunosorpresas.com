name: CI

# Verificación de PRs, solo lectura. Los PR que solo cambian src/content/** (los del sync
# desde Google Sheets) ya se validan con `build` dentro del sync y se fusionan solos; además,
# los eventos creados por el bot no pueden pedir permisos de escritura.
on:
  pull_request:
    paths-ignore:
      - 'src/content/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
